<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>算命学鑑定ツール</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* --- ここに既存のCSSを維持 --- */
        body { font-family: "Times New Roman", "Yu Mincho", "游明朝", serif; padding: 20px; max-width: 600px; margin: 0 auto; background-color: #fcfbf9; color: #333; }
        .input-group { margin-bottom: 15px; }
        label { display: inline-block; width: 80px; font-weight: bold; }
        input[type="number"] { padding: 6px; width: 80px; font-size: 16px; font-family: inherit; }
        #calc-btn { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #8a1414; color: #fff; border: none; border-radius: 4px; margin-top: 10px; margin-bottom: 30px; }
        /* メモ入力欄のスタイル */
#comment-input {
    height: 60px;        /* 高さ（ご希望の3倍程度） */
    width: 80%;
    padding: 10px;       /* 内側の余白 */
    font-size: 16px;     /* 文字サイズ */
    vertical-align: top; /* 上揃え */
}

        .meishiki-table { border-collapse: collapse; margin-bottom: 20px; }
        .meishiki-table td { vertical-align: top; padding: 0 15px; border-right: 1px dashed #ccc; text-align: center; font-size: 16px; }
        .meishiki-table td:last-child { border-right: none; }
        .pillar-label { font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .eto-text { writing-mode: vertical-rl; text-orientation: upright; font-size: 28px; font-weight: bold; letter-spacing: 5px; line-height: 1.5; display: inline-block; }
        .eto-text-small { writing-mode: vertical-rl; text-orientation: upright; font-size: 22px; font-weight: bold; letter-spacing: 5px; line-height: 1.5; display: inline-block; color: #555; }
        
        #body-map { border-collapse: collapse; margin-top: 20px; table-layout: fixed; }
        #body-map td { font-size: 24px !important; text-align: center; vertical-align: middle; padding: 20px; width: 60px; height: 60px; border: 1px solid #000; }
        #pos-h { border-top: none !important; }
        #pos-i { border: none !important; }
        #pos-e { border: none !important; }
        #pos-b { border-left: none !important; }
        #pos-d { border-bottom: none !important; }
        #pos-f { border-right: none !important; }
        #pos-a, #pos-g, #pos-c { border: none !important; }

        .daiun-table {
    border-collapse: collapse;
    width: 70%;
    max-width: 560px; /* 少し広げてみます */
    margin-top: 20px;
    table-layout: auto; /* 自動レイアウト */
}

.daiun-table th, .daiun-table td {
    padding: 8px; /* パディングを少し減らしてスペースを確保 */
    border: 1px solid #ccc;
    text-align: center;
    font-family: sans-serif; /* テストのため一度 sans-serif に変更して挙動を確認 */
    white-space: nowrap;    /* ★重要：改行を禁止して横並びを強制します */
    font-family: "Yu Mincho", "游明朝", serif !important;
    font-size: 14px;        /* 少し小さくして収まりを良くします */
}


   /* 干支表示エリアの強制縦並び (最強設定) */
.eto-grid {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    
    font-size: 28px !important;
    font-weight: bold !important;
    line-height: 1.2 !important;
    height: 75px !important;
    margin: 0 auto !important;
    padding: 0 !important;
    white-space: nowrap !important;
}

.eto-grid-small {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    font-size: 20px !important; /* 少し小さめに設定 */
    font-weight: bold !important;
    height: 60px !important;
    margin: 0 auto !important;
}

/* 干支の1文字ずつ(span)の設定 */
.eto-grid span {
    display: block !important;
    font-size: 28px !important;
    font-weight: bold !important;
    color: inherit; /* 文字色が親要素とずれるのを防ぐ */
}
/* ★「小さいサイズ」専用の指定（これだけを追加） */
.eto-small span {
    font-size: 20px !important; /* 小さくしたいサイズ */
    font-weight: bold !important;
    line-height: 1.2 !important;
}
        
        /* 1. 履歴リストの親要素 */
#history-list {
    margin: 0;
    padding: 0;
    display: block;
    max-height: 400px; 
    overflow-y: auto;
}

/* 2. 履歴アイテム（統合しました） */
.history-item {
    display: flex;
    align-items: center;
    font-size: 14px;
    margin-bottom: 5px;      /* 2px〜5pxの間で調整してください */
    padding-bottom: 2px;
    border-bottom: 1px dashed #ccc;
    white-space: nowrap;      /* 改行を防ぐ */
}

/* 3. アイテム内のラベル */
.history-item label {
    display: inline-block !important; /* 必須 */
    width: 150px !important;
    white-space: nowrap !important;
    overflow: hidden !important;
    text-overflow: ellipsis !important;
}

/* 4. その他必要なスタイル */
.input-cell {
    text-align: center;
}

.current-age-row {
    color: red !important;
    font-weight: bold !important;
}

#comment-input {
    width: 100%;           /* 幅を枠いっぱいに */
    word-wrap: break-word; /* 長い単語でも折り返す */
    word-break: break-all; /* 強制的に改行 */
    white-space: pre-wrap; /* 改行を保持しつつ、枠に合わせて折り返す */
}

.left-side {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 0 0 350px;
}

@media (max-width: 600px) {
    .top-wrapper {
        flex-direction: column !important; /* スマホでは縦並びに */
    }
    .left-side, .right-side {
        width: 100% !important;
        flex: 0 0 100% !important;
    }
    /* ボタンを押しやすくする */
    .category-buttons button, .bottom-category-area button {
        padding: 10px;
        margin: 5px;
    }
}

.header-container {
    display: flex;
    align-items: center; /* タイトルとボタンの縦位置を揃える */
    gap: 10px;           /* タイトルとボタンの間の余白 */
    padding: 20px;
}

h1 {
    margin: 0;           /* デフォルトの余白を消す */
}

#help-btn {
    width: 24px;         /* 小さめに */
    height: 24px;
    padding: 0;
    border-radius: 50%;  /* 丸いボタンに */
    border: 1px solid #999;
    background: transparent;
    color: #666;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    transition: all 0.2s;
}

#help-btn:hover {
    background: #eee;
    color: #333;
    border-color: #333;
}

.button-container {
    display: flex;
    flex-wrap: wrap;   /* 折り返しを有効にする */
    gap: 10px;         /* ボタン間の隙間 */
    margin: 10px 0;
}

.button-container button {
    /* 3つ並べるために、100%を3分割して隙間(gap)分を引く */
    width: calc(33.33% - 10px); 
    padding: 10px 0;
    box-sizing: border-box; /* paddingを含めて幅を計算する */
}
</style>

</head>
<body>
    <!-- 【ステップ1】アプリ全体を上下分割用に包み込むコンテナの開始 -->
    <div id="app-container" style="display: flex; flex-direction: column; min-height: 100vh; background: #fff;">

        <!-- 【上ペイン】従来のすべてのコンテンツが中に入るエリア（スクロール可能） -->
        <div id="top-pane" style="padding: 15px; background: #fff; transition: all 0.3s ease; box-sizing: border-box;">

            <div class="header-container">
                <h1>算命学・命式算出</h1>
                <button id="help-btn" onclick="openHelp()">?</button>
            </div>

            <!-- 入力＆算出エリア（縦並びでゆったり配置） -->
            <div class="input-section" style="margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; max-width: 400px;">
                <div class="input-group" style="display: flex; align-items: center; gap: 5px;">
                    <label style="width: 70px;">西暦年:</label>
                    <input type="tel" id="year-input" pattern="\d*" maxlength="4" style="height: 25px; padding: 5px; font-size: 16px; width: 80px;" oninput="checkInput(this, 'month-input', 4)">
                </div>
                <div class="input-group" style="display: flex; align-items: center; gap: 5px;">
                    <label style="width: 70px;">月:</label>
                    <input type="tel" id="month-input" pattern="\d*" maxlength="2" style="height: 25px; padding: 5px; font-size: 16px; width: 80px;" oninput="checkInput(this, 'day-input', 2)">
                </div>
                <div class="input-group" style="display: flex; align-items: center; gap: 5px;">
                    <label style="width: 70px;">日:</label>
                    <input type="tel" id="day-input" pattern="\d*" maxlength="2" style="height: 25px; padding: 5px; font-size: 16px; width: 80px;">
                </div>

                <div class="gender-section" style="display: flex; align-items: center; gap: 10px; margin-top: 5px;">
                    <span style="font-weight: bold;">性別:</span>
                    <div>
                        <input type="radio" id="male" name="gender" value="male" checked> 男
                        <input type="radio" id="female" name="gender" value="female"> 女
                        <span id="age-display" style="margin-left: 10px; font-weight: bold;"></span>
                    </div>
                </div>

                <div>
                    <button id="calc-btn" style="padding: 10px 20px; font-size: 16px; cursor: pointer; background: #8a1414; color: #fff; border: none; border-radius: 4px; width: 100%;">算出</button>
                </div>
                
                <div class="input-group">
                    <label style="display: block; margin-bottom: 3px;">メモ:</label>
                    <textarea id="comment-input" placeholder="コメント入力" rows="2" style="width: 100%; box-sizing: border-box;"></textarea>
                </div>
                
                <button id="share-or-copy-btn" style="display: none; padding: 8px;">結果を保存</button>
            </div>

            <!-- 履歴エリア -->
            <div class="history-area" style="margin-bottom: 20px; max-width: 400px;">
                <h4>履歴</h4>
                <div id="history-list"></div>
                <button id="import-btn" type="button" onclick="HistoryModule.importSelected()" style="padding: 8px 15px; font-size: 14px; cursor: pointer; margin-top: 5px;">履歴取込</button>
            </div>
            
            <!-- 結果表示エリア（本来の広い幅を確保） -->
            <div id="result-area" style="display: none; flex-direction: column; gap: 20px; margin-bottom: 25px;">
                <div class="main-area">
                    <h2 id="display-title"></h2>
                    <table class="meishiki-table">
                        <tr>
                            <td><div class="pillar-label">天中殺</div><div id="tenchusatsu-text" class="eto-grid eto-small"></div></td>
                            <td><div class="pillar-label">日</div><div id="day-eto" class="eto-grid eto-large"></div><div id="day-zoukan"></div></td>
                            <td><div class="pillar-label">月</div><div id="month-eto" class="eto-grid eto-large"></div><div id="month-zoukan"></div></td>
                            <td><div class="pillar-label">年</div><div id="year-eto" class="eto-grid eto-large"></div><div id="year-zoukan"></div></td>
                            <td><div class="pillar-label">年干天中</div><div id="nenkan-tenchu-text" class="eto-grid eto-small"></div></td>
                        </tr>
                    </table>
                </div>

                <div id="shugoshin-result" style="margin: 10px 0; display: none;">
                    <div id="shugoshin-content" style="font-size: 16px; line-height: 1.6;"></div>
                </div>

                <table id="body-map">
                    <tr><td id="pos-a">--</td><td id="pos-h">頭</td><td id="pos-g">初年</td></tr>
                    <tr><td id="pos-b">右手</td><td id="pos-i">胸</td><td id="pos-f">左手</td></tr>
                    <tr><td id="pos-c">晩年</td><td id="pos-d">腹</td><td id="pos-e">中年</td></tr>
                </table>
            </div>

            <!-- 性格診断エリア -->
            <div id="diagnosis-area" style="margin-bottom: 20px;"></div>

            <!-- ★ 性格診断の下、大運表の上のAI鑑定セクション -->
            <div class="ai-section" style="margin: 20px 0; padding: 15px; border: 2px solid #2c3e50; border-radius: 8px; background: #fdfdfd; box-sizing: border-box; max-width: 600px;">
                <h3 style="margin-top: 0; color: #2c3e50; font-size: 1.1em;">🤖 AIによる鑑定</h3>
                
                <div class="form-group" style="margin-bottom: 10px;">
                    <label style="font-weight: bold; font-size: 0.9em; display: block; margin-bottom: 5px;">鑑定内容を選択：</label>
                    <select id="ai-menu-select" onchange="toggleAiInput()" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 0.95em;">
                        <option value="shukumei">その人の宿命</option>
                        <option value="this-year">今年の運勢</option>
                        <option value="next-year">来年の運勢</option>
                        <option value="compatibility-love">相性診断（恋愛・結婚）</option>
                        <option value="compatibility-work">相性診断（ビジネス・対人関係）</option> 
                        <option value="free">自由入力文による質問</option>
                    </select>
                </div>

                <!-- 自由入力用のテキストエリア -->
                <div id="free-input-area" style="margin-bottom: 10px; display: none;">
                    <textarea id="ai-free-question" placeholder="例：5年以内に転職を考えていますが、いつ頃が良いでしょうか？" style="width: 100%; height: 60px; padding: 8px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; font-size: 0.9em;"></textarea>
                </div>

                <!-- AI鑑定ボタン -->
                <button onclick="requestAiConsultation()" style="width: 100%; padding: 12px; background: #2c3e50; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 1em;">
                    AIに鑑定を依頼する
                </button>
                <!-- 履歴から読み込んだときに表示・有効化する「AI鑑定結果を再表示するボタン」の例 -->
<!-- 個人鑑定結果を見るボタンのエリア -->
<div id="history-action-area" style="display: none; margin-top: 10px;">
    <button type="button" onclick="showAiResultFromHistory()" style="padding: 8px 15px; font-size: 14px; cursor: pointer;">💬 個人鑑定のAI結果を見る</button>
</div>
<!-- 相性診断の結果エリアの付近や、操作パネルの中に配置 -->
<div id="compat-image-action-area" style="display: none; margin-top: 15px; text-align: center;">
    <button type="button" onclick="downloadCompatImage()" style="background: #10b981; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px;">
        📷 相性診断結果を画像で保存
    </button>
</div>

            </div>

            <!-- 大運表エリア -->
            <div class="side-area" style="margin-bottom: 30px;">
                <h3>大運表</h3>
                <table class="daiun-table">
                    <thead><tr><th>年齢</th><th width="60px">大運</th><th>十大主星</th><th>十二大従星</th></tr></thead>
                    <tbody id="daiun-table-body"></tbody>
                </table>
            </div>

            <!-- 戦国武将・歴代総理などのリストエリア -->
            <div class="bottom-category-area" style="margin-top: 30px; border-top: 2px solid #ccc; padding-top: 20px; width: 100%;">
                <div class="button-container" style="margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
                    <button onclick="showList('sengoku')">戦国武将</button>
    <button onclick="showList('edo')">江戸文化人</button>
    <button onclick="showHistoryList()">過去履歴</button>
    <button onclick="showList('entertainer')">有名芸能人</button>
    <button onclick="showList('contributor')">日本の偉人</button>
    <button onclick="showList('shocking')">世・震・人</button>
    <button onclick="showList('royal_figures')">皇室関係</button>
    <button onclick="showList('prime_ministers')">歴代総理</button>
                </div>
                    
                <div id="figure-display-area" style="width: 100%; max-width: 600px; height: 300px; overflow-y: auto; border: 1px solid #ccc; padding: 5px; background: #fff;">
                    リストを選択してください
                </div>
            </div>

        </div><!-- /#top-pane の終わり -->


        <!-- 【下ペイン】AI鑑定結果および追加チャットエリア（最初は非表示） -->
        <div id="bottom-pane" style="display: none; height: 55vh; border-top: 3px solid #2c3e50; background: #f4f6f8; flex-direction: column; padding: 10px; box-sizing: border-box;">
            
            <!-- 下ペインのヘッダー -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid #ddd; padding-bottom: 5px;">
                <span style="font-weight: bold; color: #2c3e50; font-size: 0.95em;">💬 AI鑑定結果・チャット</span>
                <button onclick="closeAIChat()" style="background: none; border: none; font-size: 1.1em; cursor: pointer; color: #666; padding: 5px;">✖ 閉じる</button>
            </div>

            <!-- チャットログ・鑑定結果のスクロールエリア -->
            <div id="ai-chat-messages" style="flex: 1; overflow-y: auto; padding: 5px; display: flex; flex-direction: column; gap: 10px;">
                <!-- AIからの回答ややり取りがここに流れます -->
            </div>

            <!-- 追加質問の入力エリア -->
            <div style="display: flex; gap: 5px; margin-top: 8px;">
                <input type="text" id="ai-followup-input" placeholder="追加で質問する..." style="flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9em;" onkeypress="if(event.key==='Enter') sendFollowUpMessage()">
                <button onclick="sendFollowUpMessage()" style="padding: 8px 15px; background: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">送信</button>
            </div>

        </div><!-- /#bottom-pane の終わり -->

    </div><!-- /#app-container の終わり -->

    <!-- スクリプトファイルの読み込み -->
    <script src="sekki_data.js"></script>
    <script src="star_tables.js"></script>
    <script src="shugoshin_data.js"></script>
    
    <script src="js/sekki_1800_1809.js"></script>
    <script src="js/sekki_1810_1819.js"></script>
    <script src="js/sekki_1820_1829.js"></script>
    <script src="js/sekki_1830_1839.js"></script>
    <script src="js/sekki_1840_1849.js"></script>
    <script src="js/sekki_1850_1859.js"></script>
    <script src="js/sekki_1860_1869.js"></script>
    <script src="js/sekki_1870_1879.js"></script>
    <script src="js/sekki_1880_1889.js"></script>
    <script src="js/sekki_1890_1899.js"></script>
    <script src="js/sengoku_figures.js"></script>
    <script src="js/edo_culture_figures.js"></script>
    <script src="js/entertainer.js"></script>
    <script src="js/contributor.js"></script>
    <script src="js/shocking.js"></script>
    <script src="js/diagnosis.js"></script>
    <script src="js/royal_figures.js"></script>
    <script src="js/prime_ministers.js"></script>

    <script src="main.js"></script>
</body>
</html>
